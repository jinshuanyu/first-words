<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>First Words 多語言學習卡</title>
<!-- 芫荽 Iansui：台羅附加符號（Gâu-tsá）和中文才會正常顯示 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Iansui&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Iansui','PingFang TC','Microsoft JhengHei',sans-serif;
  background:#FAF6EF;color:#2C2C2C;
  min-height:100vh;overflow-x:hidden;
}
.header{
  background:#2C2C2C;color:#FAF6EF;
  text-align:center;padding:2rem 1rem 1.6rem;
}
.header h1{font-size:2rem;font-weight:400;letter-spacing:0.06em}
.header p{font-size:0.9rem;opacity:0.7;margin-top:0.4rem}

.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:1rem;padding:1.4rem 1rem;max-width:760px;margin:0 auto;
}
.lang{
  display:block;text-decoration:none;color:inherit;
  background:#fff;border-radius:14px;overflow:hidden;
  box-shadow:0 4px 14px rgba(0,0,0,0.07);
  transition:transform 0.15s, box-shadow 0.15s;
}
.lang:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,0.1)}
.lang:active{transform:scale(0.97)}
.lang .top{
  background:var(--c);color:#FAF6EF;
  padding:1.3rem 1rem 1.1rem;text-align:center;
  font-size:1.6rem;letter-spacing:0.04em;
}
.lang .body{padding:0.8rem 1rem 1rem;text-align:center}
.lang .name{font-size:1.15rem;color:var(--c)}
.lang .units{font-size:0.78rem;color:#9B8E7B;margin-top:0.3rem}

.footer{text-align:center;padding:1.2rem 1rem 2rem;font-size:0.75rem;color:#bbb;line-height:1.7}

@media(max-width:420px){
  .header h1{font-size:1.6rem}
  .grid{grid-template-columns:repeat(2,1fr);gap:0.7rem;padding:1rem 0.8rem}
  .lang .top{font-size:1.3rem;padding:1rem 0.5rem 0.9rem}
  .lang .name{font-size:1rem}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="header">
  <h1>First Words</h1>
  <p>多語言學習卡・選一個語言開始</p>
</div>

<div class="grid" id="grid"></div>

<div class="footer">每個語言都有：字母與發音・基本單字・基本用語・小對話<br>點卡片聽發音，也可以切換到測驗模式翻牌練習</div>

<script>
// ── 語言清單：要加新語言就在這裡加一行 ──
const LANGS = [
  { file:"en.html", hello:"Hello!",      name:"英語",     color:"#2F5D8A", unit:"字母與發音" },
  { file:"ja.html", hello:"こんにちは！", name:"日語",     color:"#9E2B2B", unit:"五十音" },
  { file:"tw.html", hello:"Gâu-tsá！",   name:"台語",     color:"#2E6B5E", unit:"台羅字母" },
  { file:"es.html", hello:"¡Hola!",      name:"西班牙語", color:"#B5522B", unit:"字母與發音" },
  { file:"fr.html", hello:"Bonjour !",   name:"法語",     color:"#1E3355", unit:"字母與發音" },
  { file:"de.html", hello:"Hallo!",      name:"德語",     color:"#3A3A3A", unit:"字母與發音" },
  { file:"it.html", hello:"Ciao!",       name:"義大利語", color:"#1F4D3A", unit:"字母與發音" },
];

document.getElementById('grid').innerHTML = LANGS.map(l => `
  <a class="lang" href="${l.file}" style="--c:${l.color}">
    <div class="top">${l.hello}</div>
    <div class="body">
      <div class="name">${l.name}</div>
      <div class="units">${l.unit}・單字・用語・對話</div>
    </div>
  </a>`).join('');
</script>
</body>
</html>
