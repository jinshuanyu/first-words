<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>德文 Ü 試聽</title>
<!-- 暫時的試聽頁：選好之後會刪掉 -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,'Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif;background:#FAF6EF;color:#2C2C2C;padding:1.2rem 1rem 3rem}
h1{font-size:1.4rem;text-align:center;margin-bottom:0.3rem}
p.hint{text-align:center;color:#9B8E7B;font-size:0.9rem;margin-bottom:1.2rem}
.list{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:0.7rem}
button{
  display:flex;align-items:center;gap:0.9rem;width:100%;text-align:left;
  background:#fff;border:2px solid #3A3A3A;border-radius:12px;padding:0.9rem 1rem;
  font-size:1.1rem;font-family:inherit;color:#2C2C2C;cursor:pointer;
}
button:active,button.playing{background:#3A3A3A;color:#FAF6EF}
.no{font-size:1.6rem;font-weight:700;width:2rem;text-align:center}
.small{display:block;font-size:0.85rem;opacity:0.7}
</style>
</head>
<body>
<h1>德文 Ü 試聽</h1>
<p class="hint">點一下聽，選好告訴我號碼</p>
<div class="list" id="list"></div>
<script>
const C = [
  ['Katja', '直接念字母（網站上現在這版）'],
  ['Katja', 'IPA /yː/'],
  ['Katja', 'IPA 拉長、放慢'],
  ['Amala（女聲）', '直接念字母'],
  ['Seraphina（女聲）', '直接念字母'],
  ['Conrad（男聲）', '直接念字母'],
  ['Florian（男聲）', '直接念字母'],
];
let cur = null;
document.getElementById('list').innerHTML = C.map((c, i) =>
  `<button data-i="${i + 1}"><span class="no">${i + 1}</span><span>${c[0]}<span class="small">${c[1]}</span></span></button>`).join('');
document.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
  if (cur) cur.pause();
  document.querySelectorAll('button').forEach(x => x.classList.remove('playing'));
  b.classList.add('playing');
  cur = new Audio(`audio/_test/ue${b.dataset.i}.mp3`);
  cur.onended = () => b.classList.remove('playing');
  cur.play().catch(() => {});
}));
</script>
</body>
</html>
